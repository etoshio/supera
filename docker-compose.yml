version: '3.9'

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: access_db
      POSTGRES_USER: access_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U access_user -d access_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app1:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/access_db
      SPRING_DATASOURCE_USERNAME: access_user
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - db
    networks:
      - app-net
    restart: unless-stopped

  app2:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/access_db
      SPRING_DATASOURCE_USERNAME: access_user
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - db
    networks:
      - app-net
    restart: unless-stopped

  app3:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/access_db
      SPRING_DATASOURCE_USERNAME: access_user
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - db
    networks:
      - app-net
    restart: unless-stopped

  nginx:
    image: nginx:stable
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge
